<!DOCTYPE html>
<html lang="ms" class="bg-zinc-950 text-white scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Tips Kewangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @keyframes premiumGlow {
      0%, 100% {
        border-color: rgb(39, 39, 42); /* border-zinc-800 */
        box-shadow: 0 0 0 0 rgba(251, 191, 36, 0);
      }
      50% {
        border-color: rgb(251, 191, 36); /* border-amber-400 */
        box-shadow: 0 0 20px 2px rgba(251, 191, 36, 0.25);
      }
    }
    .highlight-pulse {
      animation: premiumGlow 2s ease-in-out 2; /* Berdenyut sebanyak 2 kali */
    }
    /* Sembunyikan scrollbar untuk paparan kategori yang lebih kemas pada desktop */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ── Kad Artikel Fintech Premium ── */
    .fintech-card {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .fintech-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.9;
      z-index: -1;
    }
    .fintech-card::after {
      content: "";
      position: absolute;
      top: -40%;
      right: -20%;
      width: 60%;
      height: 80%;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.35;
      z-index: -1;
      pointer-events: none;
    }

    .fc-gold::before { background: linear-gradient(155deg, rgba(120,53,15,0.35) 0%, rgba(24,24,27,0.98) 55%); }
    .fc-gold::after   { background: radial-gradient(circle, #fbbf24 0%, transparent 70%); }
    .fc-gold          { border-color: rgba(251,191,36,0.28) !important; }

    .fc-emerald::before { background: linear-gradient(155deg, rgba(6,78,59,0.35) 0%, rgba(24,24,27,0.98) 55%); }
    .fc-emerald::after   { background: radial-gradient(circle, #34d399 0%, transparent 70%); }
    .fc-emerald          { border-color: rgba(52,211,153,0.25) !important; }

    .fc-indigo::before { background: linear-gradient(155deg, rgba(49,46,129,0.4) 0%, rgba(24,24,27,0.98) 55%); }
    .fc-indigo::after   { background: radial-gradient(circle, #818cf8 0%, transparent 70%); }
    .fc-indigo          { border-color: rgba(129,140,248,0.25) !important; }

    .fc-rose::before { background: linear-gradient(155deg, rgba(136,19,55,0.35) 0%, rgba(24,24,27,0.98) 55%); }
    .fc-rose::after   { background: radial-gradient(circle, #fb7185 0%, transparent 70%); }
    .fc-rose          { border-color: rgba(251,113,133,0.25) !important; }

    .fc-cyan::before { background: linear-gradient(155deg, rgba(22,78,99,0.4) 0%, rgba(24,24,27,0.98) 55%); }
    .fc-cyan::after   { background: radial-gradient(circle, #22d3ee 0%, transparent 70%); }
    .fc-cyan          { border-color: rgba(34,211,238,0.25) !important; }

    .read-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
    }
  </style>
</head>
<body class="min-h-screen pb-12 bg-zinc-950 max-w-md mx-auto border-x border-zinc-900/40">
  
  <header class="border-b border-zinc-900 sticky top-0 bg-zinc-950/80 backdrop-blur-md z-40">
    <div class="p-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-zinc-400 hover:text-amber-400"><i class="fa-solid fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-bold">Hub Tips Kewangan</h1>
      </div>
    </div>
    
    <div id="category-tabs-container" class="flex items-end gap-2 px-4 pb-3">
      <div id="cat-dropdown" class="relative flex-1 min-w-0">
        <div class="text-[10px] font-bold text-amber-300 uppercase tracking-wider mb-1">#Tips Kewangan</div>
        <button id="cat-btn" type="button" aria-haspopup="listbox" aria-expanded="false"
          class="w-full flex items-center justify-between gap-2 text-xs font-bold text-zinc-950 bg-amber-400 px-4 py-2.5 rounded-xl border border-amber-400 transition-all shadow-md shadow-amber-400/10">
          <span id="cat-label" class="flex items-center gap-1.5 min-w-0 truncate"></span>
          <i id="cat-chevron" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
        </button>
        <div id="cat-menu" role="listbox"
          class="hidden absolute left-0 right-0 mt-1 max-h-64 overflow-y-auto no-scrollbar bg-zinc-900 border border-zinc-800 rounded-xl shadow-xl shadow-black/50 p-1 space-y-1 z-50"></div>
      </div>

      <div class="flex flex-col items-center justify-center bg-zinc-900 border border-amber-400/25 rounded-xl px-2.5 py-1.5 min-w-[64px]">
        <span id="stat-unread" class="text-sm font-bold text-amber-300 leading-none">0</span>
        <span class="text-[9px] text-zinc-400 font-medium mt-1 whitespace-nowrap">Belum Dibaca</span>
      </div>
      <div class="flex flex-col items-center justify-center bg-zinc-900 border border-emerald-400/25 rounded-xl px-2.5 py-1.5 min-w-[64px]">
        <span id="stat-read" class="text-sm font-bold text-emerald-300 leading-none">0</span>
        <span class="text-[9px] text-zinc-400 font-medium mt-1 whitespace-nowrap">Sudah Dibaca</span>
      </div>
    </div>
  </header>

  <main class="p-4 space-y-4" id="artikel-list-container">
  </main>

  <script src="../js/tipskewangan-data.js"></script>
<script src="../js/main.js"></script>
  <script>
    // Palet kad fintech premium — diputar mengikut susunan artikel
    const CARD_PALETTE = ["fc-gold", "fc-emerald", "fc-indigo", "fc-rose", "fc-cyan"];

    // ── Fungsi Status Bacaan (Sudah Dibaca / Belum Dibaca) ──
    function isArticleRead(id) {
      return localStorage.getItem("dibaca_" + id) === "1";
    }
    function setArticleRead(id, status) {
      localStorage.setItem("dibaca_" + id, status ? "1" : "0");
    }
    function toggleReadStatus(id) {
      const nowRead = !isArticleRead(id);
      setArticleRead(id, nowRead);

      const btn = document.querySelector('.read-toggle-btn[data-id="' + id + '"]');
      const badge = document.querySelector('.read-badge[data-id="' + id + '"]');

      if (btn) {
        if (nowRead) {
          btn.className = "read-toggle-btn text-xs font-semibold px-3 py-2 rounded-xl border transition-colors flex items-center gap-1 text-emerald-300 border-emerald-400/40 bg-emerald-400/10";
          btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Sudah Dibaca';
        } else {
          btn.className = "read-toggle-btn text-xs font-semibold px-3 py-2 rounded-xl border transition-colors flex items-center gap-1 text-zinc-400 border-zinc-700 bg-zinc-900/60";
          btn.innerHTML = '<i class="fa-regular fa-circle"></i> Belum Dibaca';
        }
      }
      if (badge) {
        badge.classList.toggle("hidden", !nowRead);
      }

      // Kemas kini dropdown kategori & statistik secara automatik
      if (typeof window.__refreshReadUI === "function") window.__refreshReadUI();
    }

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("artikel-list-container");
      const catBtn = document.getElementById("cat-btn");
      const catLabel = document.getElementById("cat-label");
      const catChevron = document.getElementById("cat-chevron");
      const catMenu = document.getElementById("cat-menu");
      const catDropdown = document.getElementById("cat-dropdown");
      const statUnread = document.getElementById("stat-unread");
      const statRead = document.getElementById("stat-read");
      let currentActiveCategory = "Semua";

      const categories = ["Semua", ...new Set(ARTIKEL_DATA.map(art => art.category))];

      // ── Link khas kategori: contoh #tips-#1-Emas-&-Kewangan ──
      function categorySlug(cat) {
        return "tips-" + String(cat).trim().replace(/\s+/g, "-");
      }
      function findCategoryByHash(rawHash) {
        let h = rawHash.replace("#", "");
        try { h = decodeURIComponent(h); } catch (e) {}
        h = h.toLowerCase();
        return categories.find(cat => cat !== "Semua" && categorySlug(cat).toLowerCase() === h) || null;
      }

      // ── Status kategori: sudah dibaca sepenuhnya? ──
      function isCategoryFullyRead(cat) {
        const list = cat === "Semua" ? ARTIKEL_DATA : ARTIKEL_DATA.filter(art => art.category === cat);
        return list.length > 0 && list.every(art => isArticleRead(art.id));
      }

      function tickIcon() {
        const i = document.createElement("i");
        i.className = "fa-solid fa-circle-check text-emerald-400 text-[11px] shrink-0";
        return i;
      }

      function updateStats() {
        const list = currentActiveCategory === "Semua"
          ? ARTIKEL_DATA
          : ARTIKEL_DATA.filter(art => art.category === currentActiveCategory);
        const readCount = list.filter(art => isArticleRead(art.id)).length;
        statRead.textContent = readCount;
        statUnread.textContent = list.length - readCount;
      }

      function renderCategoryDropdown() {
        // Butang dropdown (kategori aktif)
        const activeRead = currentActiveCategory !== "Semua" && isCategoryFullyRead(currentActiveCategory);
        catBtn.className = activeRead
          ? "w-full flex items-center justify-between gap-2 text-xs font-bold text-emerald-300 bg-zinc-900 px-4 py-2.5 rounded-xl border border-emerald-400/40 transition-all shadow-md shadow-emerald-400/10"
          : "w-full flex items-center justify-between gap-2 text-xs font-bold text-zinc-950 bg-amber-400 px-4 py-2.5 rounded-xl border border-amber-400 transition-all shadow-md shadow-amber-400/10";
        catLabel.innerHTML = "";
        const txt = document.createElement("span");
        txt.className = "truncate";
        txt.textContent = currentActiveCategory;
        catLabel.appendChild(txt);
        if (activeRead) catLabel.appendChild(tickIcon());

        // Senarai pilihan
        catMenu.innerHTML = "";
        categories.forEach(cat => {
          const isActive = cat === currentActiveCategory;
          const isRead = cat !== "Semua" && isCategoryFullyRead(cat);
          const item = document.createElement("button");
          item.type = "button";
          item.setAttribute("role", "option");
          item.setAttribute("aria-selected", isActive ? "true" : "false");

          const base = "w-full flex items-center justify-between gap-2 text-left text-xs px-3 py-2.5 rounded-lg transition-all ";
          let tone;
          if (isRead) {
            tone = isActive
              ? "font-bold text-emerald-300 bg-emerald-400/10 border border-emerald-400/40"
              : "font-medium text-emerald-300 border border-transparent hover:bg-emerald-400/10";
          } else {
            tone = isActive
              ? "font-bold text-amber-300 bg-amber-400/10 border border-amber-400/40"
              : "font-medium text-zinc-400 border border-transparent hover:text-zinc-200 hover:bg-zinc-800";
          }
          item.className = base + tone;

          const name = document.createElement("span");
          name.className = "truncate";
          name.textContent = cat;
          item.appendChild(name);
          if (isRead) item.appendChild(tickIcon());

          item.onclick = () => {
            setCategory(cat, true);
            closeMenu();
          };
          catMenu.appendChild(item);
        });
      }

      function refreshReadUI() {
        renderCategoryDropdown();
        updateStats();
      }
      window.__refreshReadUI = refreshReadUI;

      function openMenu() {
        catMenu.classList.remove("hidden");
        catBtn.setAttribute("aria-expanded", "true");
        catChevron.classList.add("rotate-180");
      }
      function closeMenu() {
        catMenu.classList.add("hidden");
        catBtn.setAttribute("aria-expanded", "false");
        catChevron.classList.remove("rotate-180");
      }
      catBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        catMenu.classList.contains("hidden") ? openMenu() : closeMenu();
      });
      document.addEventListener("click", (e) => {
        if (!catDropdown.contains(e.target)) closeMenu();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });

      function setCategory(cat, updateHash) {
        currentActiveCategory = cat;
        refreshReadUI();
        renderArticles();
        if (updateHash) {
          // Kemas kini URL tanpa mencetuskan hashchange
          const base = window.location.pathname + window.location.search;
          const newUrl = cat === "Semua" ? base : base + "#" + categorySlug(cat);
          try { history.replaceState(null, "", newUrl); } catch (e) {}
        }
      }

      function renderArticles() {
        container.innerHTML = "";
        
        const filteredData = currentActiveCategory === "Semua" 
          ? ARTIKEL_DATA 
          : ARTIKEL_DATA.filter(art => art.category === currentActiveCategory);

        filteredData.forEach((art, idx) => {
          const paletteClass = CARD_PALETTE[idx % CARD_PALETTE.length];
          const read = isArticleRead(art.id);

          const box = document.createElement("div");
          box.className = `fintech-card ${paletteClass} bg-zinc-900 border rounded-2xl p-4 flex flex-col justify-between space-y-4 shadow-lg transition-all duration-300`;
          box.innerHTML = `
            <span class="read-badge ${read ? '' : 'hidden'}" data-id="${art.id}">
              <i class="fa-solid fa-circle-check text-emerald-400 text-sm drop-shadow"></i>
            </span>
            <div>
              <div class="flex justify-between items-center mb-2 pr-5">
                 <span class="text-[10px] font-bold text-amber-300 uppercase tracking-wider bg-amber-400/10 px-2 py-1 rounded-md border border-amber-400/20">${art.category}</span>
              </div>
              <h3 class="text-base font-bold text-zinc-50 leading-snug">${art.title}</h3>
              <span class="block text-[10px] text-zinc-400 font-medium mt-1">Oleh: ${art.author}</span>
              <p class="text-xs text-zinc-300 mt-2 leading-relaxed">${art.summary}</p>
            </div>
            <div class="flex justify-between items-center pt-2 border-t border-white/10">
              <button onclick="copyGlobalLink('gold-saver/tips-kewangan.html#${art.id}')" class="text-xs text-zinc-300 hover:text-amber-300 flex items-center gap-1"><i class="fa-solid fa-copy"></i> Salin</button>
              <div class="flex items-center gap-2">
                <button
                  onclick="toggleReadStatus('${art.id}')"
                  data-id="${art.id}"
                  class="read-toggle-btn text-xs font-semibold px-3 py-2 rounded-xl border transition-colors flex items-center gap-1 ${read ? 'text-emerald-300 border-emerald-400/40 bg-emerald-400/10' : 'text-zinc-400 border-zinc-700 bg-zinc-900/60'}"
                >
                  <i class="${read ? 'fa-solid fa-check-circle' : 'fa-regular fa-circle'}"></i> ${read ? 'Sudah Dibaca' : 'Belum Dibaca'}
                </button>
                <a href="${art.path}" class="text-xs font-bold text-zinc-950 bg-amber-400 px-4 py-2 rounded-xl hover:bg-amber-300 transition-colors">Baca Penuh</a>
              </div>
            </div>
          `;
          box.id = art.id;
          container.appendChild(box);
        });
      }

      function handleHashHighlight() {
        const hash = window.location.hash;
        if (hash) {
          const targetId = hash.replace("#", "");
          const linkedArticle = ARTIKEL_DATA.find(art => art.id === targetId);
          
          if (linkedArticle) {
            if (currentActiveCategory !== "Semua" && currentActiveCategory !== linkedArticle.category) {
              setCategory(linkedArticle.category, false);
            }
            
            const targetCard = document.getElementById(targetId);
            if (targetCard) {
              setTimeout(() => {
                targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
                targetCard.classList.add("highlight-pulse");
                setTimeout(() => {
                  targetCard.classList.remove("highlight-pulse");
                }, 4000); 
              }, 300);
            }
            return;
          }

          // Link khas kategori
          const linkedCategory = findCategoryByHash(hash);
          if (linkedCategory) {
            setCategory(linkedCategory, false);
            setTimeout(() => {
              const headerEl = document.querySelector("header");
              const offset = headerEl ? headerEl.offsetHeight : 0;
              const top = container.getBoundingClientRect().top + window.pageYOffset - offset - 8;
              window.scrollTo({ top: Math.max(top, 0), behavior: "smooth" });
              catBtn.classList.add("highlight-pulse");
              container.classList.add("highlight-pulse");
              setTimeout(() => {
                catBtn.classList.remove("highlight-pulse");
                container.classList.remove("highlight-pulse");
              }, 4000);
            }, 300);
          }
        }
      }

      refreshReadUI();
      renderArticles();
      handleHashHighlight();

      window.addEventListener("hashchange", handleHashHighlight);
    });
  </script>
</body>
</html>
