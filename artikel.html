<!DOCTYPE html>
<html lang="ms" class="bg-zinc-950 text-white scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Artikel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @keyframes premiumGlow {
      0%, 100% {
        border-color: rgb(39, 39, 42); /* border-zinc-800 */
        box-shadow: 0 0 0 0 rgba(251, 191, 36, 0);
      }
      50% {
        border-color: rgb(251, 191, 36); /* border-amber-400 */
        box-shadow: 0 0 20px 2px rgba(251, 191, 36, 0.25);
      }
    }
    .highlight-pulse {
      animation: premiumGlow 2s ease-in-out 2; /* Berdenyut sebanyak 2 kali */
    }
    /* Sembunyikan scrollbar untuk paparan kategori yang lebih kemas pada desktop */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ── Animasi toast & butang (Bacaan Terakhir) ── */
    @keyframes fadeUpSoft {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up-soft {
      animation: fadeUpSoft 0.35s ease-out both;
    }
    .filter-btn:active {
      transform: scale(0.97);
    }

    /* ── Tabung Emas Animation ── */
    .tabung-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 44px;
    }
    .tabung-wrap svg {
      width: 26px;
      height: 26px;
      position: absolute;
      bottom: 9px;
      z-index: 2;
      filter: drop-shadow(0 2px 6px rgba(251,191,36,0.25));
    }

    /* Syiling emas jatuh setiap 3 saat */
    .coin-drop {
      position: absolute;
      top: 0;
      left: 50%;
      width: 9px;
      height: 9px;
      margin-left: -4.5px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fef3c7 0%, #fbbf24 55%, #d97706 100%);
      border: 1px solid #b45309;
      box-shadow: 0 0 6px rgba(251,191,36,0.6);
      opacity: 0;
      z-index: 1;
      animation: coin-fall 3s ease-in infinite;
    }
    @keyframes coin-fall {
      0%   { opacity: 0; transform: translateY(-2px) scaleX(1); }
      10%  { opacity: 1; transform: translateY(0px) scaleX(1); }
      35%  { opacity: 1; transform: translateY(8px) scaleX(0.35); }
      50%  { opacity: 1; transform: translateY(14px) scaleX(1); }
      60%  { opacity: 0; transform: translateY(19px) scaleX(0.6); }
      100% { opacity: 0; transform: translateY(19px) scaleX(0.6); }
    }

    /* Kilauan emas */
    .tabung-spark {
      position: absolute;
      top: 6px;
      right: 1px;
      width: 6px;
      height: 6px;
      background: #fde68a;
      clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
      opacity: 0;
      z-index: 3;
      animation: tabung-spark-pulse 3s ease-in-out infinite;
      animation-delay: 1.5s;
    }
    @keyframes tabung-spark-pulse {
      0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
      20%      { opacity: 1; transform: scale(1.3) rotate(45deg); }
      40%      { opacity: 0; transform: scale(0.4) rotate(90deg); }
    }

    /* Tooltip "Daftar Percuma" muncul dari kiri setiap 5 saat */
    .tabung-tooltip {
      position: absolute;
      right: calc(100% + 10px);
      top: 50%;
      margin-top: -14px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.01em;
      white-space: nowrap;
      color: #1c1917;
      background: linear-gradient(135deg, #fde68a 0%, #fbbf24 55%, #f59e0b 100%);
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(251,191,36,0.28), inset 0 1px 0 rgba(255,255,255,0.5);
      pointer-events: none;
      opacity: 0;
      z-index: 5;
      animation: tabung-tooltip-loop 5s ease-in-out infinite;
    }
    .tabung-tooltip::after {
      content: "";
      position: absolute;
      left: 100%;
      top: 50%;
      margin-top: -5px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 6px solid #f59e0b;
    }
    @keyframes tabung-tooltip-loop {
      0%   { opacity: 0; transform: translateX(-10px); }
      10%  { opacity: 1; transform: translateX(0); }
      45%  { opacity: 1; transform: translateX(0); }
      55%  { opacity: 0; transform: translateX(-6px); }
      100% { opacity: 0; transform: translateX(-10px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .coin-drop, .tabung-spark, .tabung-tooltip { animation: none; }
      .tabung-tooltip { opacity: 1; }
    }
    
    /* Dropdown Transition */
    #tabung-dropdown {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    #tabung-dropdown.show {
      display: block !important;
      opacity: 1 !important;
      transform: translateY(0) !important;
    }
  </style>
</head>
<body class="min-h-screen pb-12 bg-zinc-950 max-w-md mx-auto border-x border-zinc-900/40">
  
  <header class="border-b border-zinc-900 sticky top-0 bg-zinc-950/80 backdrop-blur-md z-40">
    <div class="p-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-zinc-400 hover:text-amber-400"><i class="fa-solid fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-bold">Hub Artikel</h1>
      </div>
      
      <div class="relative">
        <button onclick="toggleTabungMenu()" id="tabung-btn" aria-label="Menu Tabung Emas"
          class="flex items-center justify-center text-amber-400 focus:outline-none transition-colors hover:text-yellow-300"
          style="background:none; border:none; padding:0;">
          <div id="tabung-wrap" class="tabung-wrap">
            <div class="tabung-tooltip">Daftar Percuma</div>
            <div class="coin-drop"></div>
            <div class="tabung-spark"></div>
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="tabung-gold" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#fde68a" />
                  <stop offset="0.55" stop-color="#fbbf24" />
                  <stop offset="1" stop-color="#d97706" />
                </linearGradient>
              </defs>
              <!-- Badan tabung (kotak) -->
              <rect x="4" y="8" width="16" height="13" rx="2.5" fill="url(#tabung-gold)" />
              <!-- Penutup atas -->
              <rect x="2.5" y="4.5" width="19" height="4.5" rx="2" fill="url(#tabung-gold)" stroke="#b45309" stroke-width="0.8" />
              <!-- Slot syiling -->
              <rect x="8" y="5.9" width="8" height="1.7" rx="0.85" fill="#451a03" />
              <!-- Jalur hiasan -->
              <rect x="7" y="13" width="10" height="1.4" rx="0.7" fill="#b45309" opacity="0.55" />
              <rect x="9" y="16" width="6" height="1.4" rx="0.7" fill="#b45309" opacity="0.35" />
            </svg>
          </div>
        </button>

        <div id="tabung-dropdown"
          class="absolute right-0 mt-3 w-52 bg-zinc-900 border border-zinc-800 rounded-2xl p-2 hidden opacity-0 -translate-y-2 shadow-2xl z-50">

          <button onclick="triggerDaftarPopup()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-zinc-200 hover:bg-zinc-800 rounded-xl transition-colors text-left">
            <i class="fa-solid fa-user-plus text-amber-400"></i>
            <span>Daftar Percuma</span>
          </button>

          <a href="https://ilmu-emas.pages.dev/emas-guide" target="_blank"
            class="flex items-center gap-3 px-4 py-2.5 text-sm text-zinc-200 hover:bg-zinc-800 rounded-xl transition-colors">
            <i class="fa-solid fa-comments text-amber-400"></i>
            <span>Pertanyaan</span>
          </a>
        </div>
      </div>
    </div>
    
    <div id="category-tabs-container" class="flex items-end gap-2 px-4 pb-3">
      <div id="cat-dropdown" class="relative flex-1 min-w-0">
        <div class="text-[10px] font-bold text-amber-300 uppercase tracking-wider mb-1">#Artikel</div>
        <button id="cat-btn" type="button" aria-haspopup="listbox" aria-expanded="false"
          class="w-full flex items-center justify-between gap-2 text-xs font-bold text-zinc-950 bg-amber-400 px-4 py-2.5 rounded-xl border border-amber-400 transition-all shadow-md shadow-amber-400/10">
          <span id="cat-label" class="flex items-center gap-1.5 min-w-0 truncate"></span>
          <i id="cat-chevron" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
        </button>
        <div id="cat-menu" role="listbox"
          class="hidden absolute left-0 right-0 mt-1 max-h-64 overflow-y-auto no-scrollbar bg-zinc-900 border border-zinc-800 rounded-xl shadow-xl shadow-black/50 p-1 space-y-1 z-50"></div>
      </div>

      <button id="filter-last" type="button" aria-label="Pergi ke bacaan terakhir"
        class="filter-btn shrink-0 flex items-center justify-center gap-1.5 text-[11px] font-bold px-3 py-2.5 rounded-xl border transition-all whitespace-nowrap text-amber-300 bg-amber-400/10 border-amber-400/40 hover:bg-amber-400/20">
        <i class="fa-solid fa-clock-rotate-left text-[11px]"></i><span>Bacaan Terakhir</span>
      </button>
    </div>
  </header>

  <!-- Toast mesej ringkas -->
  <div id="last-toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-[calc(100%-2rem)] max-w-sm bg-zinc-900 border border-amber-400/30 text-zinc-200 text-xs font-medium px-4 py-3 rounded-xl shadow-xl shadow-black/50 flex items-center gap-2">
    <i class="fa-solid fa-circle-info text-amber-300"></i>
    <span id="last-toast-text"></span>
  </div>

  <main class="p-4 space-y-4" id="artikel-list-container">
  </main>

  <div id="daftar-pilihan-modal" class="fixed inset-0 z-50 bg-zinc-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-all duration-300">
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 w-full max-w-sm text-center space-y-4">
      <h4 class="font-bold text-lg text-white">Kategori Pendaftaran Akaun</h4>
      <p class="text-xs text-zinc-400">Pilih kategori umur pemohon di bawah:</p>
      <div class="space-y-3 pt-2">
        <a href="https://pgdealer-wanhasbullah.pages.dev/pendaftaran-adult" target="_blank" class="block w-full py-3 bg-zinc-800 hover:bg-amber-400 hover:text-zinc-950 font-semibold text-sm rounded-xl transition-all">Dewasa (18 Tahun Ke Atas)</a>
        <a href="https://pgdealer-wanhasbullah.pages.dev/pendaftaran-junior" target="_blank" class="block w-full py-3 bg-zinc-800 hover:bg-amber-400 hover:text-zinc-950 font-semibold text-sm rounded-xl transition-all">Junior (17 Tahun Ke Bawah)</a>
      </div>
      <button onclick="closeDaftarPopup()" class="text-xs text-zinc-500 hover:text-zinc-300 pt-2 block mx-auto underline">Tutup</button>
    </div>
  </div>

  <script src="js/artikel-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Fungsi Toggle Dropdown Tabung Emas
    function toggleTabungMenu() {
      const dropdown = document.getElementById("tabung-dropdown");
      dropdown.classList.toggle("show");
    }

    // Fungsi untuk membuka Modal Daftar Percuma
    function triggerDaftarPopup() {
      const dropdown = document.getElementById("tabung-dropdown");
      if (dropdown) dropdown.classList.remove("show");

      const modal = document.getElementById("daftar-pilihan-modal");
      modal.classList.remove("hidden");
      void modal.offsetWidth; 
      modal.classList.remove("opacity-0");
    }

    // Fungsi untuk menutup Modal Daftar Percuma
    function closeDaftarPopup() {
      const modal = document.getElementById("daftar-pilihan-modal");
      modal.classList.add("opacity-0");
      setTimeout(() => {
        modal.classList.add("hidden");
      }, 300);
    }

    // Klik luar untuk menutup dropdown tabung
    window.addEventListener("click", (e) => {
      const btn = document.getElementById("tabung-btn");
      const dropdown = document.getElementById("tabung-dropdown");
      if (btn && dropdown && !btn.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove("show");
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("artikel-list-container");
      const catBtn = document.getElementById("cat-btn");
      const catLabel = document.getElementById("cat-label");
      const catChevron = document.getElementById("cat-chevron");
      const catMenu = document.getElementById("cat-menu");
      const catDropdown = document.getElementById("cat-dropdown");
      const lastBtn = document.getElementById("filter-last");
      let currentActiveCategory = "Semua";

      // Kunci localStorage untuk kad yang terakhir diklik
      const LAST_READ_KEY = "artikel_bacaan_terakhir";

      const categories = ["Semua", ...new Set(ARTIKEL_DATA.map(art => art.category))];

      // ── Link khas kategori: contoh #Tips-#25-:-Kerugian-Membeli-Barang-Kemas ──
      function categorySlug(cat) {
        return String(cat).trim().replace(/\s+/g, "-");
      }
      // Slug ringkas (huruf kecil, tanpa simbol): contoh #gap-auto-debit
      function categorySimpleSlug(cat) {
        return String(cat).trim().toLowerCase()
          .replace(/&/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }
      function findCategoryByHash(rawHash) {
        let h = rawHash.replace("#", "");
        try { h = decodeURIComponent(h); } catch (e) {}
        h = h.toLowerCase();
        return categories.find(cat => cat !== "Semua" &&
          (categorySlug(cat).toLowerCase() === h || categorySimpleSlug(cat) === h)) || null;
      }

      function renderCategoryDropdown() {
        // Butang dropdown (kategori aktif)
        catLabel.innerHTML = "";
        const txt = document.createElement("span");
        txt.className = "truncate";
        txt.textContent = currentActiveCategory;
        catLabel.appendChild(txt);

        // Senarai pilihan
        catMenu.innerHTML = "";
        categories.forEach(cat => {
          const isActive = cat === currentActiveCategory;
          const item = document.createElement("button");
          item.type = "button";
          item.setAttribute("role", "option");
          item.setAttribute("aria-selected", isActive ? "true" : "false");

          const base = "w-full flex items-center justify-between gap-2 text-left text-xs px-3 py-2.5 rounded-lg transition-all ";
          const tone = isActive
            ? "font-bold text-amber-300 bg-amber-400/10 border border-amber-400/40"
            : "font-medium text-zinc-400 border border-transparent hover:text-zinc-200 hover:bg-zinc-800";
          item.className = base + tone;

          const name = document.createElement("span");
          name.className = "truncate";
          name.textContent = cat;
          item.appendChild(name);

          item.onclick = () => {
            setCategory(cat, true);
            closeMenu();
          };
          catMenu.appendChild(item);
        });
      }

      function openMenu() {
        catMenu.classList.remove("hidden");
        catBtn.setAttribute("aria-expanded", "true");
        catChevron.classList.add("rotate-180");
      }
      function closeMenu() {
        catMenu.classList.add("hidden");
        catBtn.setAttribute("aria-expanded", "false");
        catChevron.classList.remove("rotate-180");
      }
      catBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        catMenu.classList.contains("hidden") ? openMenu() : closeMenu();
      });
      document.addEventListener("click", (e) => {
        if (!catDropdown.contains(e.target)) closeMenu();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });

      function setCategory(cat, updateHash) {
        currentActiveCategory = cat;
        renderCategoryDropdown();
        renderArticles();
        if (updateHash) {
          // Kemas kini URL tanpa mencetuskan hashchange
          const base = window.location.pathname + window.location.search;
          const newUrl = cat === "Semua" ? base : base + "#" + categorySlug(cat);
          try { history.replaceState(null, "", newUrl); } catch (e) {}
        }
      }

      // ── Toast ringkas ──
      let toastTimer = null;
      function showToast(msg) {
        const toast = document.getElementById("last-toast");
        const text = document.getElementById("last-toast-text");
        if (!toast || !text) return;
        text.textContent = msg;
        toast.classList.remove("hidden");
        toast.classList.remove("fade-up-soft");
        void toast.offsetWidth;
        toast.classList.add("fade-up-soft");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.add("hidden"), 3000);
      }

      // ── Bacaan Terakhir: simpan & pergi ke kad terakhir diklik ──
      function saveLastRead(id) {
        try { localStorage.setItem(LAST_READ_KEY, id); } catch (e) {}
      }
      function getLastReadId() {
        try { return localStorage.getItem(LAST_READ_KEY); } catch (e) { return null; }
      }
      function goToLastRead() {
        const lastId = getLastReadId();
        const art = lastId ? ARTIKEL_DATA.find(a => a.id === lastId) : null;
        if (!art) {
          showToast("Belum ada bacaan terakhir. Klik mana-mana kad untuk bermula.");
          return;
        }

        // Pastikan kad kelihatan: pilih kategori yang sesuai jika perlu
        if (currentActiveCategory !== "Semua" && currentActiveCategory !== art.category) {
          setCategory(art.category, true);
        }

        setTimeout(() => {
          const card = document.getElementById(art.id);
          if (!card) return;
          card.scrollIntoView({ behavior: "smooth", block: "center" });
          card.classList.remove("highlight-pulse");
          void card.offsetWidth;
          card.classList.add("highlight-pulse");
          setTimeout(() => card.classList.remove("highlight-pulse"), 4000);
        }, 300);
      }
      lastBtn.addEventListener("click", goToLastRead);

      function renderArticles() {
        container.innerHTML = "";
        
        const filteredData = currentActiveCategory === "Semua" 
          ? ARTIKEL_DATA 
          : ARTIKEL_DATA.filter(art => art.category === currentActiveCategory);

        filteredData.forEach(art => {
          const box = document.createElement("div");
          box.className = "bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-col justify-between space-y-4 shadow-sm transition-all duration-300";
          box.innerHTML = `
            <div>
              <div class="flex justify-between items-center mb-2">
                 <span class="text-[10px] font-bold text-amber-400 uppercase tracking-wider bg-amber-400/5 px-2 py-1 rounded-md border border-amber-400/10">${art.category}</span>
                 <span class="text-[10px] text-zinc-500 font-medium">Oleh: ${art.author}</span>
              </div>
              <h3 class="text-base font-bold text-zinc-100 leading-snug">${art.title}</h3>
              <p class="text-xs text-zinc-400 mt-2 leading-relaxed">${art.summary}</p>
            </div>
            <div class="flex justify-between items-center pt-2 border-t border-zinc-800/60">
              <button onclick="copyGlobalLink('artikel.html#${art.id}')" class="text-xs text-zinc-400 hover:text-amber-400 flex items-center gap-1"><i class="fa-solid fa-copy"></i> Salin</button>
              <a href="${art.path}" class="text-xs font-bold text-zinc-950 bg-amber-400 px-4 py-2 rounded-xl hover:bg-amber-300 transition-colors">Baca Penuh</a>
            </div>
          `;
          box.id = art.id;
          // Rekod kad terakhir yang diklik (untuk butang Bacaan Terakhir)
          box.addEventListener("click", () => saveLastRead(art.id));
          container.appendChild(box);
        });
      }

      function handleHashHighlight() {
        const hash = window.location.hash;
        if (hash) {
          const targetId = hash.replace("#", "");
          const linkedArticle = ARTIKEL_DATA.find(art => art.id === targetId);
          
          if (linkedArticle) {
            if (currentActiveCategory !== "Semua" && currentActiveCategory !== linkedArticle.category) {
              setCategory(linkedArticle.category, false);
            }
            
            const targetCard = document.getElementById(targetId);
            if (targetCard) {
              setTimeout(() => {
                targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
                targetCard.classList.add("highlight-pulse");
                setTimeout(() => {
                  targetCard.classList.remove("highlight-pulse");
                }, 4000); 
              }, 300);
            }
            return;
          }

          // Link khas kategori
          const linkedCategory = findCategoryByHash(hash);
          if (linkedCategory) {
            setCategory(linkedCategory, false);
            setTimeout(() => {
              // Auto-scroll ke bahagian artikel, tidak terlindung oleh sticky header
              const headerEl = document.querySelector("header");
              const offset = headerEl ? headerEl.offsetHeight : 0;
              const top = container.getBoundingClientRect().top + window.pageYOffset - offset - 8;
              window.scrollTo({ top: Math.max(top, 0), behavior: "smooth" });
              // Kesan premium glow
              catBtn.classList.add("highlight-pulse");
              container.classList.add("highlight-pulse");
              setTimeout(() => {
                catBtn.classList.remove("highlight-pulse");
                container.classList.remove("highlight-pulse");
              }, 4000);
            }, 300);
          }
        }
      }

      renderCategoryDropdown();
      renderArticles();
      handleHashHighlight();

      window.addEventListener("hashchange", handleHashHighlight);
    });
  </script>
</body>
</html>
