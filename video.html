<!DOCTYPE html>
<html lang="ms" class="bg-zinc-950 text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akademi Multimedia - Ilmu Emas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @keyframes video-highlight {
    0%   { box-shadow: 0 0 0 0 rgba(251,191,36,0.0); border-color: rgba(63,63,70,0.8); }
    25%  { box-shadow: 0 0 0 4px rgba(251,191,36,0.35), 0 8px 32px rgba(251,191,36,0.15); border-color: rgba(251,191,36,0.8); }
    50%  { box-shadow: 0 0 0 2px rgba(251,191,36,0.15), 0 4px 16px rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.4); }
    75%  { box-shadow: 0 0 0 4px rgba(251,191,36,0.25), 0 8px 24px rgba(251,191,36,0.12); border-color: rgba(251,191,36,0.6); }
    100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.0); border-color: rgba(63,63,70,0.8); }
  }
  .video-highlight-anim {
    animation: video-highlight 1.6s ease 3;
    scroll-margin-top: 140px;
  }
  /* Sembunyikan scrollbar untuk kategori */
  .scrollbar-none::-webkit-scrollbar {
    display: none;
  }
  .scrollbar-none {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  /* ── Tabung Emas Animation ── */
  .tabung-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 44px;
  }
  .tabung-wrap svg {
    width: 26px;
    height: 26px;
    position: absolute;
    bottom: 9px;
    z-index: 2;
    filter: drop-shadow(0 2px 6px rgba(251,191,36,0.25));
  }

  /* Syiling emas jatuh setiap 3 saat */
  .coin-drop {
    position: absolute;
    top: 0;
    left: 50%;
    width: 9px;
    height: 9px;
    margin-left: -4.5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fef3c7 0%, #fbbf24 55%, #d97706 100%);
    border: 1px solid #b45309;
    box-shadow: 0 0 6px rgba(251,191,36,0.6);
    opacity: 0;
    z-index: 1;
    animation: coin-fall 3s ease-in infinite;
  }
  @keyframes coin-fall {
    0%   { opacity: 0; transform: translateY(-2px) scaleX(1); }
    10%  { opacity: 1; transform: translateY(0px) scaleX(1); }
    35%  { opacity: 1; transform: translateY(8px) scaleX(0.35); }
    50%  { opacity: 1; transform: translateY(14px) scaleX(1); }
    60%  { opacity: 0; transform: translateY(19px) scaleX(0.6); }
    100% { opacity: 0; transform: translateY(19px) scaleX(0.6); }
  }

  /* Kilauan emas */
  .tabung-spark {
    position: absolute;
    top: 6px;
    right: 1px;
    width: 6px;
    height: 6px;
    background: #fde68a;
    clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
    opacity: 0;
    z-index: 3;
    animation: tabung-spark-pulse 3s ease-in-out infinite;
    animation-delay: 1.5s;
  }
  @keyframes tabung-spark-pulse {
    0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
    20%      { opacity: 1; transform: scale(1.3) rotate(45deg); }
    40%      { opacity: 0; transform: scale(0.4) rotate(90deg); }
  }

  /* Tooltip "Daftar Percuma" muncul dari kiri setiap 5 saat */
  .tabung-tooltip {
    position: absolute;
    right: calc(100% + 10px);
    top: 50%;
    margin-top: -14px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.01em;
    white-space: nowrap;
    color: #1c1917;
    background: linear-gradient(135deg, #fde68a 0%, #fbbf24 55%, #f59e0b 100%);
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(251,191,36,0.28), inset 0 1px 0 rgba(255,255,255,0.5);
    pointer-events: none;
    opacity: 0;
    z-index: 5;
    animation: tabung-tooltip-loop 5s ease-in-out infinite;
  }
  .tabung-tooltip::after {
    content: "";
    position: absolute;
    left: 100%;
    top: 50%;
    margin-top: -5px;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 6px solid #f59e0b;
  }
  @keyframes tabung-tooltip-loop {
    0%   { opacity: 0; transform: translateX(-10px); }
    10%  { opacity: 1; transform: translateX(0); }
    45%  { opacity: 1; transform: translateX(0); }
    55%  { opacity: 0; transform: translateX(-6px); }
    100% { opacity: 0; transform: translateX(-10px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .coin-drop, .tabung-spark, .tabung-tooltip { animation: none; }
    .tabung-tooltip { opacity: 1; }
  }

  /* Dropdown Transition */
  #tabung-dropdown {
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #tabung-dropdown.show {
    display: block !important;
    opacity: 1 !important;
    transform: translateY(0) !important;
  }
</style>
</head>
<body class="min-h-screen pb-12 bg-zinc-950 max-w-md mx-auto border-x border-zinc-900/40">
  
  <header class="p-4 border-b border-zinc-900 flex items-center justify-between sticky top-0 bg-zinc-950/80 backdrop-blur-md z-40">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-zinc-400 hover:text-amber-400"><i class="fa-solid fa-arrow-left text-lg"></i></a>
      <h1 class="text-base font-bold">Akademi Multimedia</h1>
    </div>
    
    <div class="relative">
      <button onclick="toggleTabungMenu()" id="tabung-btn" aria-label="Menu Tabung Emas"
        class="flex items-center justify-center text-amber-400 focus:outline-none transition-colors hover:text-yellow-300"
        style="background:none; border:none; padding:0;">
        <div id="tabung-wrap" class="tabung-wrap">
          <div class="tabung-tooltip">Daftar Percuma</div>
          <div class="coin-drop"></div>
          <div class="tabung-spark"></div>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="tabung-gold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fde68a" />
                <stop offset="0.55" stop-color="#fbbf24" />
                <stop offset="1" stop-color="#d97706" />
              </linearGradient>
            </defs>
            <!-- Badan tabung (kotak) -->
            <rect x="4" y="8" width="16" height="13" rx="2.5" fill="url(#tabung-gold)" />
            <!-- Penutup atas -->
            <rect x="2.5" y="4.5" width="19" height="4.5" rx="2" fill="url(#tabung-gold)" stroke="#b45309" stroke-width="0.8" />
            <!-- Slot syiling -->
            <rect x="8" y="5.9" width="8" height="1.7" rx="0.85" fill="#451a03" />
            <!-- Jalur hiasan -->
            <rect x="7" y="13" width="10" height="1.4" rx="0.7" fill="#b45309" opacity="0.55" />
            <rect x="9" y="16" width="6" height="1.4" rx="0.7" fill="#b45309" opacity="0.35" />
          </svg>
        </div>
      </button>

      <div id="tabung-dropdown"
        class="absolute right-0 mt-3 w-52 bg-zinc-900 border border-zinc-800 rounded-2xl p-2 hidden opacity-0 -translate-y-2 shadow-2xl z-50">

        <button onclick="triggerDaftarPopup()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-zinc-200 hover:bg-zinc-800 rounded-xl transition-colors text-left">
          <i class="fa-solid fa-user-plus text-amber-400"></i>
          <span>Daftar Percuma</span>
        </button>

        <a href="https://ilmu-emas.pages.dev/emas-guide" target="_blank"
          class="flex items-center gap-3 px-4 py-2.5 text-sm text-zinc-200 hover:bg-zinc-800 rounded-xl transition-colors">
          <i class="fa-solid fa-comments text-amber-400"></i>
          <span>Pertanyaan</span>
        </a>
      </div>
    </div>
  </header>

  <main class="p-4 space-y-6">
    <div class="space-y-3 bg-zinc-900/30 p-3 rounded-2xl border border-zinc-900/60 backdrop-blur-sm">
      <div>
        <p class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-1.5 px-1">Topik Utama</p>
        <div id="video-filter-bar" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none"></div>
      </div>
    </div>

    <div id="video-container" class="space-y-6"></div>
  </main>

  <div id="daftar-pilihan-modal" class="fixed inset-0 z-50 bg-zinc-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-all duration-300">
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 w-full max-w-sm text-center space-y-4">
      <h4 class="font-bold text-lg text-white">Kategori Pendaftaran Akaun</h4>
      <p class="text-xs text-zinc-400">Pilih kategori umur pemohon di bawah:</p>
      <div class="space-y-3 pt-2">
        <a href="https://pgdealer-wanhasbullah.pages.dev/pendaftaran-adult" target="_blank" class="block w-full py-3 bg-zinc-800 hover:bg-amber-400 hover:text-zinc-950 font-semibold text-sm rounded-xl transition-all">Dewasa (18 Tahun Ke Atas)</a>
        <a href="https://pgdealer-wanhasbullah.pages.dev/pendaftaran-junior" target="_blank" class="block w-full py-3 bg-zinc-800 hover:bg-amber-400 hover:text-zinc-950 font-semibold text-sm rounded-xl transition-all">Junior (17 Tahun Ke Bawah)</a>
      </div>
      <button onclick="closeDaftarPopup()" class="text-xs text-zinc-500 hover:text-zinc-300 pt-2 block mx-auto underline">Tutup</button>
    </div>
  </div>

  <script src="js/video-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Fungsi Toggle Dropdown Tabung Emas
    function toggleTabungMenu() {
      const dropdown = document.getElementById("tabung-dropdown");
      dropdown.classList.toggle("show");
    }

    // Fungsi untuk membuka Modal Daftar Percuma
    function triggerDaftarPopup() {
      const dropdown = document.getElementById("tabung-dropdown");
      if (dropdown) dropdown.classList.remove("show");

      const modal = document.getElementById("daftar-pilihan-modal");
      modal.classList.remove("hidden");
      void modal.offsetWidth; 
      modal.classList.remove("opacity-0");
    }

    // Fungsi untuk menutup Modal Daftar Percuma
    function closeDaftarPopup() {
      const modal = document.getElementById("daftar-pilihan-modal");
      modal.classList.add("opacity-0");
      setTimeout(() => {
        modal.classList.add("hidden");
      }, 300);
    }

    // Klik luar untuk menutup dropdown tabung
    window.addEventListener("click", (e) => {
      const btn = document.getElementById("tabung-btn");
      const dropdown = document.getElementById("tabung-dropdown");
      if (btn && dropdown && !btn.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove("show");
      }
    });

    // Keadaan Penapisan (Filter State)
    let currentVideoFilter = "all";
    
    const videoCategories = ["all", ...new Set(VIDEO_DATA.map(v => v.category))];

    // Membina Baris Penapis (Topik Utama / Kategori)
    function buildVideoFilterBar() {
      const bar = document.getElementById("video-filter-bar");
      bar.innerHTML = "";

      videoCategories.forEach(cat => {
        if(cat === "kisah-kejayaan") return;

        const btn = document.createElement("button");
        
        if(cat === "all") {
          btn.innerText = "Semua Kategori";
        } else {
          btn.innerText = cat.split("-").map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(" ");
        }

        if(cat === currentVideoFilter) {
          btn.className = "bg-amber-400 text-zinc-950 text-xs px-3.5 py-1.5 rounded-full font-bold shadow-sm whitespace-nowrap transition-all";
        } else {
          btn.className = "bg-zinc-900 text-zinc-400 hover:text-zinc-200 text-xs px-3.5 py-1.5 rounded-full font-medium border border-zinc-800/60 whitespace-nowrap transition-all";
        }

        btn.onclick = () => {
          currentVideoFilter = cat;
          buildVideoFilterBar();
          executeCombinedFilter();
        };

        bar.appendChild(btn);
      });
    }

    // Melaksanakan Tapisan Kategori
    function executeCombinedFilter() {
      renderVideos(currentVideoFilter);
    }

    function renderVideos(catFilter) {
      const container = document.getElementById("video-container");
      container.innerHTML = "";
      
      const filtered = VIDEO_DATA.filter(v => {
        if (v.category === "kisah-kejayaan") return false;
        
        // Tapisan Kategori
        return (catFilter === "all" || v.category === catFilter);
      });

      if(filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-zinc-500 space-y-2">
            <i class="fa-solid fa-video-slash text-2xl text-zinc-700"></i>
            <p class="text-xs">Tiada video ditemui untuk padanan paparan ini.</p>
          </div>
        `;
        return;
      }
      
      filtered.forEach(video => {
        const card = document.createElement("div");
        card.className = "bg-zinc-900 border border-zinc-800/80 rounded-2xl p-4 space-y-3 shadow-md";
        card.id = video.id;
        card.innerHTML = `
          <div class="overflow-hidden rounded-xl bg-zinc-950">
            ${video.embedCode}
          </div>
          <div class="flex flex-col space-y-2">
            <span class="text-[10px] font-bold text-amber-400 uppercase tracking-wider">${video.category.replace("-", " ")}</span>
            <h3 class="text-sm font-bold leading-snug text-zinc-100">${video.title}</h3>
            <div class="flex justify-end pt-1">
              <button onclick="copyGlobalLink('video.html#${video.id}')" class="text-xs text-zinc-400 hover:text-amber-400 flex items-center gap-1.5 font-medium bg-zinc-950 px-3 py-1.5 rounded-lg border border-zinc-800">
                <i class="fa-solid fa-copy"></i> Kongsi
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Inisialisasi Mula Aplikasi
    buildVideoFilterBar();
    executeCombinedFilter();

    // Mengendalikan Auto-Scroll & Kesan Denyutan Lampu Premium melalui URL Hash
    window.addEventListener("DOMContentLoaded", function () {
      const hash = window.location.hash;
      if (!hash) return;

      const targetId = hash.replace("#", "");
      const linkedVideo = VIDEO_DATA.find(v => v.id === targetId);

      if(linkedVideo) {
        // Logik semakan agar kad yang di-hash dipaparkan sekiranya ia tersembunyi
        if(currentVideoFilter !== "all" && currentVideoFilter !== linkedVideo.category) {
          currentVideoFilter = linkedVideo.category;
          buildVideoFilterBar();
        }
        
        executeCombinedFilter();

        setTimeout(function () {
          const target = document.getElementById(targetId);
          if (!target) return;

          target.scrollIntoView({ behavior: "smooth", block: "center" });

          setTimeout(function () {
            target.classList.add("video-highlight-anim");
            target.addEventListener("animationend", function () {
              target.classList.remove("video-highlight-anim");
            }, { once: true });
          }, 600);
        }, 300);
      }
    });
  </script>
</body>
</html>
