      ];

      const totalPages = ARTICLE_PAGES.length;
      let currentPage = 0;

      function pad(num) {
        return num < 10 ? "0" + num : "" + num;
      }

      function renderDots() {
        dotsContainer.innerHTML = "";
        for (let i = 0; i < totalPages; i++) {
          const dot = document.createElement("button");
          dot.className = "nav-dot" + (i === currentPage ? " active" : "");
          dot.setAttribute("aria-label", `Muka surat ${i + 1}`);
          dot.onclick = () => goToPage(i);
          dotsContainer.appendChild(dot);
        }
      }

      function renderPageNumber() {
        pageNumberDisplay.innerText = `${pad(currentPage + 1)} / ${pad(totalPages)}`;
      }

      function renderNavButtons() {
        prevBtn.disabled = currentPage <= 0;
        nextBtn.disabled = currentPage >= totalPages - 1;
      }

      function renderPage() {
        pageContent.classList.remove("page-transition");
        void pageContent.offsetWidth;
        pageContent.innerHTML = ARTICLE_PAGES[currentPage];
        pageContent.classList.add("page-transition");
        renderDots();
        renderPageNumber();
        renderNavButtons();
        window.scrollTo({ top: 0, behavior: "auto" });
      }

      function goToPage(idx) {
        if (idx < 0 || idx > totalPages - 1) return;
        currentPage = idx;
        renderPage();
      }

      prevBtn.addEventListener("click", () => goToPage(currentPage - 1));
      nextBtn.addEventListener("click", () => goToPage(currentPage + 1));

      // Keyboard navigation (desktop)
      window.addEventListener("keydown", (e) => {
        const tag = document.activeElement ? document.activeElement.tagName : "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON" || tag === "A") return;
        if (e.key === "ArrowLeft") goToPage(currentPage - 1);
        else if (e.key === "ArrowRight") goToPage(currentPage + 1);
      });

      // Swipe navigation (mobile) — tidak mengganggu scroll menegak
      let touchStartX = null;
      let touchStartY = null;
      pageArea.addEventListener("touchstart", (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });
      pageArea.addEventListener("touchend", (e) => {
        if (touchStartX === null) return;
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        const threshold = 50;

        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > threshold) {
          if (deltaX < 0) goToPage(currentPage + 1);
          else goToPage(currentPage - 1);
        }
        touchStartX = null;
        touchStartY = null;
      }, { passive: true });

      renderPage();
    })();
  </script>
